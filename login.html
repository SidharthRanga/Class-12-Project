<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome | AI Counselor</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Outfit:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
            background-color: #000000;
            color: #e0e0e0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            -webkit-font-smoothing: antialiased;
        }

        .auth-container {
            width: 90%;
            max-width: 400px;
            background-color: #050505;
            border: 1px solid #1a1a1a;
            border-radius: 32px;
            padding: 40px;
            box-shadow: 0 30px 60px rgba(0,0,0,0.9);
            text-align: center;
        }

        h1 {
            font-family: 'Outfit', sans-serif;
            font-size: 2rem;
            margin-bottom: 8px;
            background: linear-gradient(180deg, #fff 0%, #888 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p {
            color: #666;
            font-size: 0.9rem;
            margin-bottom: 32px;
        }

        .tab-group {
            display: flex;
            background-color: #0a0a0a;
            border: 1px solid #1a1a1a;
            border-radius: 12px;
            margin-bottom: 32px;
            padding: 4px;
        }

        .tab {
            flex: 1;
            padding: 10px;
            cursor: pointer;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 500;
            transition: all 0.3s ease;
            color: #666;
        }

        .tab.active {
            background-color: #ffffff;
            color: #000000;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 16px;
            margin-bottom: 32px;
        }

        input {
            background-color: #0a0a0a;
            border: 1px solid #1a1a1a;
            border-radius: 12px;
            padding: 14px 18px;
            color: #fff;
            font-size: 1rem;
            outline: none;
            transition: all 0.3s ease;
        }

        input:focus {
            border-color: #333;
            background-color: #0f0f0f;
        }

        #submit-btn {
            width: 100%;
            background-color: #ffffff;
            color: #000000;
            border: none;
            border-radius: 12px;
            padding: 16px;
            font-family: 'Outfit', sans-serif;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        #submit-btn:hover {
            background-color: #e0e0e0;
            transform: translateY(-2px);
        }

        #message {
            margin-top: 20px;
            font-size: 0.85rem;
            color: #ff4444;
        }
    </style>
</head>
<body>

    <div class="auth-container">
        <h1>Welcome</h1>
        <p>Secure access to AI Counselor</p>

        <div class="tab-group">
            <div id="login-tab" class="tab active" onclick="switchTab('login')">Login</div>
            <div id="register-tab" class="tab" onclick="switchTab('register')">Register</div>
        </div>

        <div class="input-group">
            <input type="text" id="username" placeholder="Username">
            <input type="password" id="password" placeholder="Password">
            <input type="text" id="ollama-key" placeholder="Ollama API Key" style="display: none;">
        </div>

        <button id="submit-btn" onclick="handleSubmit()">Login</button>
        <div id="message"></div>
    </div>

    <script>
        let currentMode = 'login';

        function switchTab(mode) {
            currentMode = mode;
            document.getElementById('login-tab').classList.toggle('active', mode === 'login');
            document.getElementById('register-tab').classList.toggle('active', mode === 'register');
            document.getElementById('submit-btn').innerText = mode === 'login' ? 'Login' : 'Register';

            // Show/Hide Ollama Key field based on mode
            document.getElementById('ollama-key').style.display = mode === 'register' ? 'block' : 'none';

            document.getElementById('message').innerText = '';
        }

        async function handleSubmit() {
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const ollamaKey = document.getElementById('ollama-key').value;
            const messageDiv = document.getElementById('message');

            if (!username || !password) {
                messageDiv.innerText = "Please fill in all fields";
                return;
            }

            if (currentMode === 'register' && !ollamaKey) {
                messageDiv.innerText = "Please provide your Ollama API Key";
                return;
            }

            try {
                const response = await fetch('/auth', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        mode: currentMode,
                        username: username,
                        password: password,
                        ollama_key: ollamaKey
                    })
                });

                const result = await response.json();

                if (result.success) {
                    window.location.href = '/home'; // Redirect to home page
                } else {
                    messageDiv.innerText = result.error || "Authentication failed";
                }
            } catch (error) {
                messageDiv.innerText = "Server error. Please try again.";
            }
        }
    </script>
</body>
</html>
