<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Counselor</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Outfit:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <header>
            <h1>AI Counselor</h1>
            <p>A safe space for your thoughts</p>
        </header>

        <div id="chat-window" class="chat-window">
            <!-- Messages will appear here -->
            <div class="message ai-message">
                Hello. I am your AI Counselor. How are you feeling today?
            </div>
        </div>

        <div class="actions-area" style="text-align: center; margin-bottom: 10px;">
            <button id="clear-btn" onclick="clearCurrentSessionHistory()" style="background: none; border: 1px solid #333; color: #666; cursor: pointer; padding: 5px 10px; border-radius: 5px; font-size: 0.8rem;">Clear Current Session History</button>
        </div>

        <div class="input-area">
            <input type="text" id="user-input" placeholder="Type your message..." autocomplete="off">
            <button id="send-btn">Send</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>

</html>
